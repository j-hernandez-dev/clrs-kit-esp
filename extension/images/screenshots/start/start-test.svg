<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="500"
     viewBox="0 0 900 500"
     role="img"
     aria-label="Flujo compacto de prueba CLRS y resultados">

  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20252b"/>
      <stop offset="100%" stop-color="#171b1f"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15191d"/>
      <stop offset="100%" stop-color="#171b1f"/>
    </linearGradient>

    <filter id="shadowSmall" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="8"
                    flood-color="#000000" flood-opacity=".28"/>
    </filter>

    <filter id="shadowPanel" x="-12%" y="-18%" width="124%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12"
                    flood-color="#000000" flood-opacity=".28"/>
    </filter>

    <style>
      .ui {
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .mono {
        font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
      }
      .node-title {
        font-size: 16px;
        font-weight: 600;
        fill: #c9ced8;
      }
      .node-sub {
        font-size: 11.5px;
        font-weight: 400;
        fill: #747c88;
      }
      .tab {
        font-size: 12px;
        font-weight: 400;
        fill: #9ea6b2;
      }
      .tab-active {
        font-size: 12px;
        font-weight: 500;
        fill: #d9e2ef;
      }
      .terminal {
        font-size: 15px;
        font-weight: 400;
        fill: #aeb5bf;
      }
      .terminal-label {
        fill: #c7ccd5;
      }
    </style>
  </defs>

  <!-- ======================================================
       FLUJO SUPERIOR COMPACTO
       ====================================================== -->

  <!-- JSON -->
  <g filter="url(#shadowSmall)">
    <rect x="72" y="24" width="190" height="78" rx="14"
          fill="url(#cardGrad)" stroke="#2d333b" stroke-opacity=".75"/>
  </g>

  <text x="97" y="72"
        class="mono"
        font-size="32"
        font-weight="700"
        fill="#ffbd2e">{}</text>

  <text x="145" y="55" class="ui node-title">.json</text>
  <text x="145" y="78" class="ui node-sub">casos de prueba</text>

  <!-- Flecha 1 -->
  <g fill="none" stroke="#858d98" stroke-width="4.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M279 63H326"/>
    <path d="M316 53L328 63L316 73"/>
  </g>

  <!-- Prueba -->
  <g filter="url(#shadowSmall)">
    <rect x="344" y="24" width="190" height="78" rx="14"
          fill="url(#cardGrad)" stroke="#2d333b" stroke-opacity=".75"/>
  </g>

  <!-- Icono Test -->
  <g transform="translate(366 38) scale(.78)"
     fill="none" stroke="#d5dbe4" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 6H31"/>
    <path d="M19 6V19L9.5 37.5C8.4 39.7 10 42 12.7 42H35.3
             C38 42 39.6 39.7 38.5 37.5L29 19V6"/>
    <path d="M14.5 31H33.5"/>
  </g>

  <text x="419" y="55" class="ui node-title">Prueba</text>
  <text x="419" y="78" class="ui node-sub">validar resultado</text>

  <!-- Flecha 2 -->
  <g fill="none" stroke="#858d98" stroke-width="4.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M551 63H598"/>
    <path d="M588 53L600 63L588 73"/>
  </g>

  <!-- Ejecutar -->
  <g filter="url(#shadowSmall)">
    <rect x="616" y="24" width="190" height="78" rx="14"
          fill="url(#cardGrad)" stroke="#2d333b" stroke-opacity=".75"/>
  </g>

  <!-- Icono Run -->
  <g transform="translate(639 42)"
     fill="none" stroke="#d5dbe4" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 0L35 18L8 36Z"/>
  </g>

  <text x="689" y="55" class="ui node-title">Ejecutar</text>
  <text x="689" y="78" class="ui node-sub">programa.clrs</text>

  <!-- ======================================================
       PANEL DE RESULTADOS COMPACTO
       ====================================================== -->

  <g filter="url(#shadowPanel)">
    <rect x="30" y="132" width="840" height="334" rx="14"
          fill="url(#panelGrad)" stroke="#2d333b"/>
  </g>

  <!-- Barra de pestañas -->
  <path d="M30 176H870" stroke="#2d333b" stroke-width="1"/>

  <text x="53"  y="160" class="ui tab">Problemas</text>
  <text x="122" y="160" class="ui tab">Salida</text>
  <text x="171" y="160" class="ui tab">Consola de depuración</text>
  <text x="313" y="160" class="ui tab">Terminal</text>
  <text x="376" y="160" class="ui tab-active">Resultados de la prueba</text>

  <rect x="376" y="173" width="126" height="3" rx="1.5" fill="#66b7f3"/>

  <!-- División vertical -->
  <path d="M610 176V466" stroke="#2d333b" stroke-width="1"/>

  <!-- Salida izquierda -->
  <text x="54" y="207"
        class="ui"
        font-size="12"
        font-weight="600"
        fill="#afb7c3">Salida de ejecución</text>

  <g class="mono terminal">
    <text x="54" y="247" class="terminal-label">Entrada:</text>
    <text x="54" y="272">(sin entrada)</text>

    <text x="54" y="327" class="terminal-label">Salida esperada:</text>
    <text x="54" y="352">Hola, CLRS</text>

    <text x="54" y="407" class="terminal-label">Salida obtenida:</text>
    <text x="54" y="432" fill="#9fce73">Hola, CLRS</text>
  </g>

  <!-- Panel derecho -->
  <rect x="628" y="194" width="224" height="34" rx="5"
        fill="#2b313a"
        filter="url(#shadowSmall)"/>

  <text x="642" y="216"
        class="ui"
        font-size="14"
        font-weight="600"
        fill="#e0e4eb">Pruebas CLRS</text>

  <!-- Check -->
  <g transform="translate(643 249)"
     fill="none" stroke="#72d693" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="9" r="8"/>
    <path d="M5.5 9.2L8 11.8L12.8 6.8"/>
  </g>

  <!-- Texto principal y metadato en líneas separadas para evitar cualquier solapamiento -->
  <text x="669" y="261"
        class="ui"
        font-size="13.5"
        fill="#b8bec8">Muestra el saludo inicial</text>

  <text x="669" y="282"
        class="ui"
        font-size="11.5"
        fill="#747b86">Primeras pruebas CLRS</text>

</svg>
