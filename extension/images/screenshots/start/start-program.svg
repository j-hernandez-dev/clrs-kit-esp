<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-label="Editor de código CLRS">
  <defs>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15191d"/>
      <stop offset="100%" stop-color="#171b1f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g transform="translate(40 40)">
    <rect x="0" y="0" width="1100" height="370" rx="18" ry="18"
          fill="url(#panelGradient)" stroke="#ffffff" stroke-opacity="0.05"
          filter="url(#shadow)"/>

    <!-- Controles de ventana -->
    <g>
      <circle cx="73" cy="58" r="21" fill="#ff5f57"/>
      <circle cx="139" cy="58" r="21" fill="#ffbd2e"/>
      <circle cx="205" cy="58" r="21" fill="#28c840"/>
    </g>

    <!-- Código -->
    <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace"
       font-size="54" font-weight="400" letter-spacing="1.08">
      <text x="54" y="178" fill="#667084">1</text>
      <text x="138" y="178">
        <tspan fill="#66b7f3">PRINCIPAL</tspan><tspan fill="#c9ced8">()</tspan>
      </text>

      <text x="54" y="267" fill="#667084">2</text>
      <text x="216" y="267">
        <tspan fill="#c277dd">escribir</tspan><tspan fill="#c9ced8"> </tspan><tspan fill="#9fce73">&quot;Hola, CLRS&quot;</tspan>
      </text>
    </g>
  </g>
</svg>
